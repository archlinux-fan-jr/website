<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kris Home</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="clock" id="clock"></div>
<div class="toggle" onclick="toggleMode()">Toggle Dark / Light</div>

<div class="container">
    <img src="logo.png" class="logo">

    <div class="links">
        <a class="link gmail" href="https://mail.google.com">Gmail</a>
        <a class="link youtube" href="https://youtube.com">YouTube</a>
        <a class="link whatsapp" href="https://web.whatsapp.com/">Whatsapp</a>
    </div>

    <div class="search">
        <form action="https://www.google.com/search">
            <input type="text" name="q" placeholder="Search..." autofocus>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
